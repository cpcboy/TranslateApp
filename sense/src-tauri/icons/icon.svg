<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="tileShadow" x="-35%" y="-35%" width="170%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.44" result="flood"/>
      <feComposite in="flood" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glyphShadow" x="-35%" y="-35%" width="170%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="16" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.64" result="flood"/>
      <feComposite in="flood" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="squircleClip"><path d="M 396.64 100.00 L 627.36 100.00 C 731.19 100.00, 783.11 100.00, 822.77 120.21 A 185.40 185.40 0 0 1 903.79 201.23 C 924.00 240.89, 924.00 292.81, 924.00 396.64 L 924.00 627.36 C 924.00 731.19, 924.00 783.11, 903.79 822.77 A 185.40 185.40 0 0 1 822.77 903.79 C 783.11 924.00, 731.19 924.00, 627.36 924.00 L 396.64 924.00 C 292.81 924.00, 240.89 924.00, 201.23 903.79 A 185.40 185.40 0 0 1 120.21 822.77 C 100.00 783.11, 100.00 731.19, 100.00 627.36 L 100.00 396.64 C 100.00 292.81, 100.00 240.89, 120.21 201.23 A 185.40 185.40 0 0 1 201.23 120.21 C 240.89 100.00, 292.81 100.00, 396.64 100.00 Z"/></clipPath>
    <clipPath id="upperArcClip"><path d="M 637.29 296.11 A 159.00 159.00 0 1 0 586.65 534.39 A 41.00 41.00 0 0 0 548.15 461.99 A 77.00 77.00 0 1 1 572.68 346.59 A 41.00 41.00 0 0 0 637.29 296.11 Z"/></clipPath>
    <clipPath id="lowerArcClip"><path d="M 386.71 727.89 A 159.00 159.00 0 1 0 437.35 489.61 A 41.00 41.00 0 0 0 475.85 562.01 A 77.00 77.00 0 1 1 451.32 677.41 A 41.00 41.00 0 0 0 386.71 727.89 Z"/></clipPath>

    <mask id="upperHalfMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <g transform="translate(512, 512) rotate(24)">
        <rect x="-10.00" y="-96" width="220.00" height="192" fill="black"/>
      </g>
    </mask>
    <mask id="lowerHalfMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <g transform="translate(512, 512) rotate(24)">
        <rect x="-210.00" y="-96" width="220.00" height="192" fill="black"/>
      </g>
    </mask>

    <linearGradient id="bgGrad" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1B24"/>
      <stop offset="46%" stop-color="#101016"/>
      <stop offset="100%" stop-color="#07070B"/>
    </linearGradient>

    <radialGradient id="topSheen" cx="512" cy="115" r="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coralAmbient" cx="560" cy="645" r="355" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5530" stop-opacity="0.38"/>
      <stop offset="48%" stop-color="#FF4B26" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF4B26" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pearlAmbient" cx="460" cy="375" r="310" gradientUnits="userSpaceOnUse">
