            <path d="M 637.29 296.11 A 159.00 159.00 0 1 0 586.65 534.39 A 41.00 41.00 0 0 0 548.15 461.99 A 77.00 77.00 0 1 1 572.68 346.59 A 41.00 41.00 0 0 0 637.29 296.11 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="4" transform="translate(0, 2)"/>
          </g>
        </g>

        <g mask="url(#lowerHalfMask)">
          <path d="M 386.71 727.89 A 159.00 159.00 0 1 0 437.35 489.61 A 41.00 41.00 0 0 0 475.85 562.01 A 77.00 77.00 0 1 1 451.32 677.41 A 41.00 41.00 0 0 0 386.71 727.89 Z" fill="url(#lowerBladeGrad)"/>
          <g clip-path="url(#lowerArcClip)">
            <path d="M 419.01 702.65 A 118.00 118.00 0 1 0 512.00 512.00" fill="none" stroke="#FFD6C2" stroke-opacity="0.58" stroke-width="26" stroke-linecap="round" transform="translate(0, -16)" filter="url(#softSpec)"/>
            <path d="M 386.71 727.89 A 159.00 159.00 0 1 0 437.35 489.61 A 41.00 41.00 0 0 0 475.85 562.01 A 77.00 77.00 0 1 1 451.32 677.41 A 41.00 41.00 0 0 0 386.71 727.89 Z" fill="none" stroke="#FFD8C8" stroke-opacity="0.60" stroke-width="4" transform="translate(0, 2)"/>
          </g>
        </g>
      </g>
    </g>

    <path d="M 395.59 101.75 L 628.41 101.75 C 731.26 101.75, 782.69 101.75, 821.98 121.77 A 183.65 183.65 0 0 1 902.23 202.02 C 922.25 241.31, 922.25 292.74, 922.25 395.59 L 922.25 628.41 C 922.25 731.26, 922.25 782.69, 902.23 821.98 A 183.65 183.65 0 0 1 821.98 902.23 C 782.69 922.25, 731.26 922.25, 628.41 922.25 L 395.59 922.25 C 292.74 922.25, 241.31 922.25, 202.02 902.23 A 183.65 183.65 0 0 1 121.77 821.98 C 101.75 782.69, 101.75 731.26, 101.75 628.41 L 101.75 395.59 C 101.75 292.74, 101.75 241.31, 121.77 202.02 A 183.65 183.65 0 0 1 202.02 121.77 C 241.31 101.75, 292.74 101.75, 395.59 101.75 Z" fill="none" stroke="url(#rimGrad)" stroke-width="3.5"/>
