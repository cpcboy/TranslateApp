    <rect x="100" y="100" width="824" height="824" fill="url(#topSheen)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#pearlAmbient)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#coralAmbient)"/>

    <circle cx="512" cy="512" r="326" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>

    <g transform="translate(512, 512) scale(1.09, 1.0) translate(-512, -512)">
      <path d="M 604.99 321.35 A 118.00 118.00 0 1 0 512.00 512.00" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="76" stroke-linecap="round" filter="url(#pearlBloom)"/>
      <path d="M 419.01 702.65 A 118.00 118.00 0 1 0 512.00 512.00" fill="none" stroke="#FF5230" stroke-opacity="0.48" stroke-width="82" stroke-linecap="round" filter="url(#coralBloom)"/>

