[package]
name = "sense"
version = "0.1.0"
description = "SENSE — macOS AI 翻译器"
authors = ["cpcboy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
futures-util = "0.3.34"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
