<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff;color:#1d1d1f;font-family:-apple-system,sans-serif;overflow:hidden}
.row{position:absolute;left:20px;display:flex;align-items:center;font-size:16px;white-space:nowrap}
.row svg{margin-right:9px;flex:none}
</style></head><body>
<script>
const P = {
  hamburger: '<path d="M2 4h12M2 8h12M2 12h12"/>',
  checkbox: '<rect x="2" y="2" width="12" height="12" rx="1"/>',
  calendar: '<rect x="2" y="3" width="12" height="11"/><path d="M2 7h12M5 1v4M11 1v4"/>',
  folder: '<path d="M2 4h4l2 2h6v8H2z"/>',
  doc: '<path d="M3 1h7l3 3v11H3z"/><path d="M5 8h6M5 11h6"/>',
  star: '<path d="M8 1.5l2 4.2 4.5.6-3.3 3.1.9 4.6L8 11.8l-4.1 2.2.9-4.6L1.5 6.3 6 5.7z"/>',
};
[['hamburger','Menu'],['checkbox','Remember me'],['calendar','Calendar'],['folder','Documents'],['doc','Release notes'],['star','Favorites']].forEach(([k, t], i) => {
  const r = document.createElement('div'); r.className = 'row'; r.style.top = (16 + i * 38) + 'px';
  r.innerHTML = `<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg><span>${t}</span>`;
  document.body.appendChild(r);
});

</script></body></html>
