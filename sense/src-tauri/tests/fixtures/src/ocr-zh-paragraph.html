<div class="w">
<h1>SENSE 截屏翻译</h1>
<p>SENSE 是一款运行在 macOS 上的 AI 翻译器，可以翻译你在屏幕上选中的任何内容。</p>
<p>为了保护你的隐私，所有的文字识别都在本机完成，图片不会离开你的电脑。只有识别出来的文字会发送给你选择的翻译服务，而密钥只保存在系统钥匙串里。</p>
<p class="ind">按下快捷键，拖出一个框，译文会直接盖在原文的位置上，字号和颜色都和原文一致，不用再来回切换窗口和复制粘贴。</p>
<p class="note">提示：首次使用需要授权屏幕录制。</p>
</div>
